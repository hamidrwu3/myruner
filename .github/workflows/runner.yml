name: CI Runner Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest
    steps:
      - name: Environment Setup
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process -Force
          Write-Output "Initializing environment..."

      - name: Connect Mesh Network
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ("$env:TS_KEY" -ne "") {
            echo "Installing tailscale..."
            choco install tailscale -y

            # Enable IP Forwarding in Windows Registry for Exit Node
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -Name 'IPEnableRouter' -Value 1

            # Start Tailscale Service & Set Exit Node Flag
            & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --advertise-exit-node --unattended
            Start-Sleep -Seconds 10
          } else {
            echo "Tailscale key missing, skipping..."
          }

      - name: Configure Storage Engine
        env:
          RCLONE_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          if ("$env:RCLONE_DATA" -ne "") {
            echo "Setting up rclone..."
            choco install rclone -y
            $configPath = "$env:APPDATA\rclone"
            if (!(Test-Path $configPath)) { New-Item -Path $configPath -ItemType Directory -Force }
            [System.IO.File]::WriteAllText("$configPath\rclone.conf", $env:RCLONE_DATA)
          } else {
            echo "Storage config missing, skipping..."
          }

      - name: Keep Alive Loop
        run: |
          $timeout = 350
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            Write-Output "Session active... ($elapsed mins)"
            Start-Sleep -Seconds 60
            $elapsed++
          }
